<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<!-- public/assets/mhn-favicon-light.svg and -dark.svg in one file, switched on
     the OS theme, which is what the browser's tab strip follows. -->
<style>.dark{display:none}@media (prefers-color-scheme:dark){.light{display:none}.dark{display:inline}}</style>
<defs>
<linearGradient id="fg-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B966EA"/><stop offset=".55" stop-color="#5425C9"/><stop offset="1" stop-color="#23133F"/></linearGradient>
<linearGradient id="fg-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D6B5FF"/><stop offset=".55" stop-color="#9B7BFF"/><stop offset="1" stop-color="#EDE8FF"/></linearGradient>
</defs>
<g class="light">
<rect x="4" y="4" width="120" height="120" rx="28" fill="#F8F7FC"/>
<path d="M28 92V35h16l20 23 20-23h16v57H84V59L64 82 44 59v33Z" fill="#23133F"/>
<path d="M28 35h16l20 23 20-23h16L64 79Z" fill="url(#fg-light)"/>
</g>
<g class="dark">
<rect x="4" y="4" width="120" height="120" rx="28" fill="#171323"/>
<path d="M28 92V35h16l20 23 20-23h16v57H84V59L64 82 44 59v33Z" fill="#EDE8FF"/>
<path d="M28 35h16l20 23 20-23h16L64 79Z" fill="url(#fg-dark)"/>
</g>
</svg>
